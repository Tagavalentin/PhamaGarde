services:
  - type: web
    name: pharmagarde-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://pharmagarde-api.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: pharmagarde-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pharmagarde-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pharmagarde-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pharmagarde-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: pharmagarde-db
          property: password

databases:
  - name: pharmagarde-db
    databaseName: pharmagarde
    user: pharmagarde_user
    plan: free
